{% comment %}
Section heading for a form group or card. Compose with your own grid:

    <section class="space-y-4">
        {% include "partials/section_header.html" with title="Основна информация" icon="fa-paw" %}
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2"> ...fields... </div>
    </section>
{% endcomment %}
<div class="flex items-center gap-2 border-b border-ink-100 pb-3">
    {% if icon %}
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-600">
            <i class="{{ icon }} text-xs" aria-hidden="true"></i>
        </span>
    {% endif %}
    <h2 class="section-title">{{ title }}</h2>
    {% if badge %}
        <span class="badge-neutral ml-auto">{{ badge }}</span>
    {% endif %}
</div>
