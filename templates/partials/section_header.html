<div class="flex items-center gap-2 border-b border-ink-100 pb-3">
    {% if icon %}
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-brand-600">
            <i class="{{ icon }} text-xs" aria-hidden="true"></i>
        </span>
    {% endif %}
    <h2 class="section-title">{{ title }}</h2>
    {% if badge %}
        <span class="badge-neutral ml-auto">{{ badge }}</span>
    {% endif %}
</div>
