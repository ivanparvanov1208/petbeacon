{% load i18n %}
<form method="POST" enctype="multipart/form-data" novalidate
      class="card overflow-hidden print-sheet">
    {% csrf_token %}

    {% if form.non_field_errors %}
        {% include "partials/non_field_errors.html" %}
    {% endif %}

    {% if form.errors %}
        {% include "partials/error_summary.html" with form=form %}
    {% endif %}

    <div class="space-y-8 px-5 py-6 sm:px-7 sm:py-7">
