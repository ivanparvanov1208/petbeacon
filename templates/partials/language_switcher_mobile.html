{% load i18n %}
<form method="POST" action="{% url 'set_language' %}"
      class="lang-segmented mt-1.5"
      role="group"
      aria-label="{% translate 'Смяна на езика' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% for code, name in LANGUAGES %}
        {% if code == LANGUAGE_CODE %}
            <span class="lang-segment lang-segment-active" aria-current="true">{{ name }}</span>
        {% else %}
            <button type="submit" name="language" value="{{ code }}" class="lang-segment">
                {{ name }}
            </button>
        {% endif %}
    {% endfor %}
</form>
