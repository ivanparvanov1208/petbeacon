{% load i18n petcare_tags %}
<div class="lang-segmented mt-1.5"
     role="group"
     aria-label="{% translate 'Смяна на езика' %}">
    {% for code, name in LANGUAGES %}
        {% if code == LANGUAGE_CODE %}
            <span class="lang-segment lang-segment-active" aria-current="true">{{ name }}</span>
        {% else %}
            <a href="{% localized_url request.get_full_path code %}" lang="{{ code }}" hreflang="{{ code }}" class="lang-segment">
                {{ name }}
            </a>
        {% endif %}
    {% endfor %}
</div>
