{% load i18n %}
{# Errors that belong to the form as a whole; pass variant="inset" inside a padded card. #}
<div class="{% if variant == 'inset' %}rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800 dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-200{% else %}border-b border-rose-200 bg-rose-50 px-5 py-4 text-sm text-rose-800 print-hidden{% endif %}"
     role="alert">
    <p class="flex items-center gap-2 font-semibold">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        {% translate "Възникна проблем при изпращането на формуляра" %}
    </p>
    <ul class="mt-1.5 list-disc space-y-0.5 pl-6 text-xs">
        {% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
</div>
