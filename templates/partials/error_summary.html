{% load i18n %}
{% translate "Поле" as fallback_label %}
<div class="border-b border-rose-200 bg-rose-50 px-5 py-4 text-sm text-rose-800 print-hidden"
     role="alert" tabindex="-1" id="form-errors">
    <p class="flex items-center gap-2 font-semibold">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        {% translate "Моля, коригирайте грешките по-долу" %}
    </p>
    <ul class="mt-2 space-y-1 pl-6 text-xs">
        {% for field in form %}
            {% for error in field.errors %}
                <li>
                    <a href="#{{ field.auto_id }}" class="underline decoration-rose-300 underline-offset-2 hover:decoration-rose-600">
                        <strong>{{ field.label|default:fallback_label }}:</strong> {{ error }}
                    </a>
                </li>
            {% endfor %}
        {% endfor %}
    </ul>
</div>
